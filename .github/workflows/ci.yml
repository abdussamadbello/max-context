name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # CGO is required for the tree-sitter grammars.
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Test with -race
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  lint:
    name: vet + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: go vet
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  min-go:
    # go.mod declares Go 1.22 as the minimum, so something has to prove it still
    # compiles. Ubuntu only: Go 1.22 on current macOS runners emits binaries
    # without an LC_UUID load command, which dyld then refuses to run — a
    # toolchain bug, not ours, and not worth pinning three platforms to.
    name: minimum Go version builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Build with the declared minimum
        env:
          CGO_ENABLED: '1'
        run: go build ./...

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: '1'
        run: go build -o bin/max-context ./cmd/max-context

      # Exercises the paths unit tests cannot: real indexing, the MCP handshake
      # over stdio, and the CLI subcommands.
      - name: Index this repo
        run: ./bin/max-context --index

      - name: Status reports a healthy index
        run: |
          ./bin/max-context --status | tee status.txt
          grep -q 'healthy: true' status.txt

      - name: MCP handshake over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./bin/max-context > mcp.out
          # Exactly two responses: the notification must not be answered.
          lines=$(grep -c . mcp.out)
          if [ "$lines" -ne 2 ]; then
            echo "expected 2 responses, got $lines:"; cat mcp.out; exit 1
          fi
          grep -q '"name":"get_definition"' mcp.out

      - name: CLI subcommands accept flags on either side
        run: |
          ./bin/max-context def IndexFile | grep -q '"answer_status"'
          ./bin/max-context calls Migrate -direction callers -depth 3 > calls.txt
          # -direction callers must suppress the callees list.
          if grep -q '"callees"' calls.txt; then
            echo "flags after the positional were ignored:"; cat calls.txt; exit 1
          fi

      # A multi-word query is how an agent actually asks. These used to return
      # test helpers from a path-name match instead of the symbol itself.
      - name: Multi-word queries reach camelCase symbols
        run: |
          ./bin/max-context query "resolver cache" -n 3 > q1.json
          grep -q '"name":"ResolverCache"' q1.json || { echo "missed ResolverCache:"; cat q1.json; exit 1; }
          ./bin/max-context query "index file" -n 3 > q2.json
          grep -q '"name":"IndexFile"' q2.json || { echo "missed IndexFile:"; cat q2.json; exit 1; }

      # The tool definitions are re-sent every request, so their size is a
      # per-turn tax on every session. Keep it visible in CI output.
      - name: Report tool-definition token cost
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./bin/max-context | tail -1 > tools.json
          python3 -c "
          import json
          tools = json.load(open('tools.json'))['result']['tools']
          size = len(json.dumps(tools))
          print(f'tool definitions: {size} bytes (~{size//4} tokens) across {len(tools)} tools')
          for t in tools:
              print(f\"  {t['name']:<18} {len(json.dumps(t)):>5} bytes\")
          "

      # The skill is the whole integration for harnesses with no MCP client,
      # and only loads if its frontmatter description is present.
      - name: setup writes a real, loadable skill
        run: |
          tmp=$(mktemp -d)
          ./bin/max-context -project "$tmp" setup claude-code
          skill="$tmp/.claude/skills/max-context/SKILL.md"
          test -s "$skill" || { echo "no skill written"; exit 1; }
          head -1 "$skill" | grep -q '^---$' || { echo "skill has no frontmatter:"; head -5 "$skill"; exit 1; }
          grep -q '^description: ' "$skill" || { echo "skill has no description, so it will not load"; exit 1; }
          bytes=$(wc -c < "$skill")
          test "$bytes" -gt 1000 || { echo "skill is only $bytes bytes"; exit 1; }
          echo "skill: $bytes bytes with frontmatter"

      - name: Type results carry a line number
        run: |
          ./bin/max-context def ResolverCache > d.json
          python3 -c "
          import json, sys
          d = json.load(open('d.json'))
          hits = d.get('matches') or []
          assert hits, 'no matches for ResolverCache'
          bad = [h for h in hits if not h.get('line')]
          assert not bad, f'results missing a line number: {bad}'
          "

  ceiling:
    # The retrieval-ceiling A/B: does max-context actually surface answers a
    # text search misses? It needs no model and no API key, so unlike the agent
    # experiment it can run on every push — which is the only way the published
    # numbers stay true as the tools change.
    name: retrieval ceiling A/B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build max-context
        env:
          CGO_ENABLED: '1'
        run: go build -o bin/max-context ./cmd/max-context

      # The eval harness is a separate module, so the root `go test ./...` does
      # not reach it. These assert the fixture still matches its answer key and
      # that both arms behave as published.
      - name: Ceiling tests
        working-directory: experiments/eval/benchmarks/in-house
        env:
          MAX_CONTEXT_BIN: ${{ github.workspace }}/bin/max-context
        run: go test ./internal/ceiling/ -v

      # Local fixtures only: no network, so a GitHub outage cannot redden CI.
      - name: Run the A/B and check the headline result
        working-directory: experiments/eval/benchmarks/in-house
        run: |
          go run ./cmd/ceiling -mc "${{ github.workspace }}/bin/max-context"
          python3 -c "
          import json, sys
          r = json.load(open('results/ceiling/results.json'))
          a01 = next(p for p in r['probes'] if p['task_id'] == 'A01')
          arms = {a['arm']: a for a in a01['arms']}
          gold = len(a01['gold'])
          mc, one, chain = arms['max-context'], arms['grep(one-shot)'], arms['grep(alias-chained)']
          for name, arm in arms.items():
              assert not arm.get('error'), f'{name} errored: {arm[\"error\"]}'
          assert len(mc['found']) == gold, f'max-context recall {len(mc[\"found\"])}/{gold}'
          assert len(one['found']) == 0, f'one-shot grep found {one[\"found\"]}; the alias probe is no longer testing aliasing'
          assert len(chain['found']) == gold, f'chained grep recall {len(chain[\"found\"])}/{gold}; the baseline broke'
          assert mc['tool_calls'] < chain['tool_calls'], 'max-context no longer reaches the answer in fewer calls'
          print(f'A01: max-context {len(mc[\"found\"])}/{gold} in {mc[\"tool_calls\"]} call, '
                f'chained grep {len(chain[\"found\"])}/{gold} in {chain[\"tool_calls\"]}, '
                f'one-shot grep {len(one[\"found\"])}/{gold}')
          "
